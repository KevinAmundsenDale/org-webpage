name: Build desktop installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run content:build
      - name: Build installers (sign when configured)
        run: npm run desktop:dist
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
      - name: Test Windows installation and replacement
        if: runner.os == 'Windows'
        run: node tests/install-windows.mjs
      - name: Test packaged Mac application
        if: runner.os == 'macOS'
        run: node tests/desktop.mjs --executable=release/mac-universal/Sammenheng.app/Contents/MacOS/Sammenheng
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/*.blockmap
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-files
          merge-multiple: true
      - name: Create draft app release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN || github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          REPO=$(node -p "require('./distribution.json').releaseRepository")
          TARGET=()
          if [ "$REPO" = "$GITHUB_REPOSITORY" ]; then TARGET=(--target "$GITHUB_SHA"); fi
          gh release create "v$VERSION" --repo "$REPO" "${TARGET[@]}" --draft --title "Sammenheng $VERSION" --notes-file docs/RELEASE-NOTES.md release-files/*
